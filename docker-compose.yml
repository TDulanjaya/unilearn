services:
  # Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: unilearn-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    networks:
      - unilearn-network

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: unilearn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - unilearn-network

networks:
  unilearn-network:
    driver: bridge
