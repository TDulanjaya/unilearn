services:
  # Spring Boot Backend Service (Connected to your TiDB Cloud Database & Storage)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: unilearn-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    networks:
      - unilearn-network

  # Next.js Frontend Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-unilearn}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET:-unilearn_preset}
    container_name: unilearn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - unilearn-network

networks:
  unilearn-network:
    driver: bridge
