spring.application.name=server
server.port=${PORT:8080}
spring.main.allow-circular-references=false

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unilearn_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:}

# AI limits
ai.daily-limit.chat=${AI_DAILY_LIMIT_CHAT:50}
ai.daily-limit.quiz=${AI_DAILY_LIMIT_QUIZ:10}

# Storj storage
storage.s3.key-id=${STORJ_KEY_ID:${B2_KEY_ID:}}
storage.s3.application-key=${STORJ_APPLICATION_KEY:${B2_APPLICATION_KEY:}}
storage.s3.endpoint=${STORJ_ENDPOINT:${B2_ENDPOINT:https://gateway.storjshare.io}}
storage.s3.bucket-name=${STORJ_BUCKET_NAME:${B2_BUCKET_NAME:unilearn-files}}
storage.s3.region=${STORJ_REGION:${B2_REGION:ap1}}

# Aliases
storage.b2.key-id=${storage.s3.key-id}
storage.b2.application-key=${storage.s3.application-key}
storage.b2.endpoint=${storage.s3.endpoint}
storage.b2.bucket-name=${storage.s3.bucket-name}
storage.b2.region=${storage.s3.region}

# Super admin
app.superadmin.bootstrap-enabled=${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
app.superadmin.name=${SUPER_ADMIN_NAME:}
app.superadmin.email=${SUPER_ADMIN_EMAIL:}
app.superadmin.password=${SUPER_ADMIN_PASSWORD:}
app.superadmin.phone=${SUPER_ADMIN_PHONE:}
app.superadmin.force-reset=${SUPER_ADMIN_FORCE_RESET:}

# Superadmin OTP email
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.otp.from=${OTP_FROM:${MAIL_USERNAME:}}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.log-to-console=${APP_OTP_LOG_TO_CONSOLE:false}

# JWT and cookies
# must be set in .env (at least 32 characters), the app will not start without it
jwt.secret=${JWT_SECRET:}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}
# set to true only behind a trusted proxy, otherwise anyone can fake X-Forwarded-For
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# Upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Public registration
app.registration.public-enabled=${APP_REGISTRATION_PUBLIC_ENABLED:false}
