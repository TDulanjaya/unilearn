spring.application.name=server
spring.main.allow-circular-references=true

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unilearn_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Note: JWT properties (jwt.secret, jwt.expiration-ms, jwt.refresh-expiration-ms)
# are externalized via @Value defaults in com.unilearn.server.security.JwtService
# and can be overridden using environment variables JWT_SECRET, JWT_EXPIRATION_MS, etc.
