spring.application.name=server

# CORS Configuration
# Allowed origin is set via environment variable CORS_ALLOWED_ORIGIN, defaulting to http://localhost:3000
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Note: JWT properties (jwt.secret, jwt.expiration-ms, jwt.refresh-expiration-ms)
# are externalized via @Value defaults in com.unilearn.server.security.JwtService
# and can be overridden using environment variables JWT_SECRET, JWT_EXPIRATION_MS, etc.
