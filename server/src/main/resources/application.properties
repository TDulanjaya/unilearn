spring.application.name=server
spring.main.allow-circular-references=true

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unilearn_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}

# Backblaze B2 Object Storage Configuration
storage.b2.key-id=${B2_KEY_ID:}
storage.b2.application-key=${B2_APPLICATION_KEY:}
storage.b2.endpoint=${B2_ENDPOINT:https://s3.us-west-004.backblazeb2.com}
storage.b2.bucket-name=${B2_BUCKET_NAME:unilearn-files}
storage.b2.region=${B2_REGION:us-west-004}

